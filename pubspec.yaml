name: rutacastor
description: "RutaCastor — Asistente de navegación y supervivencia universitaria para la UTP."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Estado y navegación
  provider: ^6.1.2
  go_router: ^14.3.0

  # Red
  dio: ^5.7.0

  # Sesión / almacenamiento
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  http: ^1.2.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/images/
  #   - assets/icons/
