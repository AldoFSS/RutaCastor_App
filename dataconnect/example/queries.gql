mutation CreateUserData @transaction @auth(level: USER) {
  user_insert(data: {
    id_expr: "auth.uid",
    email: "user@example.com",
    role: "student"
  })
}

mutation UpdateUserData @auth(level: USER) {
  user_update(key: {id_expr: "auth.uid"}, data: {career: "Engineering"})
}

mutation DeleteUserData @auth(level: USER) {
  user_delete(key: {id_expr: "auth.uid"})
}

query GetUserData @auth(level: USER) {
  user(key: {id_expr: "auth.uid"}) {
    id email role career
  }
}

query ListUsers @auth(level: USER) {
  users(limit: 50) {
    id email role
  }
}

mutation CreateBuilding @auth(level: PUBLIC, insecureReason: "Building information is public") {
  building_insert(data: {name: "Library", latitude: 0.0, longitude: 0.0})
}

mutation UpdateBuilding($id: UUID!) @auth(level: PUBLIC, insecureReason: "Publicly visible buildings can be updated") {
  building_update(id: $id, data: {description: "Main campus library"})
}

mutation DeleteBuilding($id: UUID!) @auth(level: PUBLIC, insecureReason: "Building removal is public") {
  building_delete(id: $id)
}

query GetBuilding($id: UUID!) @auth(level: PUBLIC, insecureReason: "Public") {
  building(id: $id) {
    name latitude longitude description
  }
}

query ListBuildings @auth(level: PUBLIC, insecureReason: "Public") {
  buildings {
    name category
  }
}

mutation CreateProcedure @auth(level: PUBLIC, insecureReason: "Procedures are public info") {
  procedure_insert(data: {
    title: "Registration",
    description: "Course enrollment",
    deadline: "2025-12-31T23:59:59Z"
  })
}

mutation UpdateProcedure($id: UUID!, $desc: String!) @auth(level: PUBLIC, insecureReason: "Public") {
  procedure_update(id: $id, data: {description: $desc})
}

mutation DeleteProcedure($id: UUID!) @auth(level: PUBLIC, insecureReason: "Public") {
  procedure_delete(id: $id)
}

query GetProcedure($id: UUID!) @auth(level: PUBLIC, insecureReason: "Public") {
  procedure(id: $id) {
    title deadline
  }
}

query ListProcedures @auth(level: PUBLIC, insecureReason: "Public") {
  procedures {
    title deadline
  }
}

mutation CreateEvent($locId: UUID!) @auth(level: PUBLIC, insecureReason: "Event info is public") {
  event_insert(data: {
    title: "Workshop",
    date: "2025-05-01T10:00:00Z",
    locationId: $locId
  })
}

mutation UpdateEvent($id: UUID!, $title: String!) @auth(level: PUBLIC, insecureReason: "Public") {
  event_update(id: $id, data: {title: $title})
}

mutation DeleteEvent($id: UUID!) @auth(level: PUBLIC, insecureReason: "Public") {
  event_delete(id: $id)
}

query GetEvent($id: UUID!) @auth(level: PUBLIC, insecureReason: "Public") {
  event(id: $id) {
    title date location { name }
  }
}

query ListEvents @auth(level: PUBLIC, insecureReason: "Public") {
  events {
    title date
  }
}

mutation CreateChatHistory($prompt: String!, $resp: String!) @auth(level: USER) {
  chatHistory_insert(data: {
    userId_expr: "auth.uid",
    prompt: $prompt,
    response: $resp,
    timestamp: "2025-01-01T12:00:00Z"
  })
}

mutation DeleteChatHistory($id: UUID!) @auth(level: USER) {
  chatHistory_delete(id: $id)
}

query GetChatHistory($id: UUID!) @auth(level: USER) {
  chatHistory(id: $id) {
    prompt response
  }
}

query ListMyChatHistory @auth(level: USER) {
  chatHistories(where: {userId: {eq_expr: "auth.uid"}}) {
    prompt timestamp
  }
}